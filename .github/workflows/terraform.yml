name: Terraform

on:
  pull_request:
    paths: ["infrastructure/**", "policies/**"]
  push:
    branches: [main]
    paths: ["infrastructure/**", "policies/**"]

permissions:
  contents: read
  # id-token: write  # Phase 2: AWS OIDC for plan/apply

jobs:
  terraform-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive infrastructure
      - name: Validate
        working-directory: infrastructure/environments/dev
        run: |
          terraform init -backend=false
          terraform validate
      # Phase 2: terraform plan -> conftest test against policies/conftest
