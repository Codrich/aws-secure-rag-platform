name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly baseline scan

permissions:
  contents: read

jobs:
  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: IaC scan with Checkov
        uses: bridgecrewio/checkov-action@9b70310bcd306d11740313070b940167d6b23085 # master pinned 2026-08-04
        with:
          directory: infrastructure
          config_file: checkov.yml
          quiet: true
          soft_fail: false

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Secret scan with TruffleHog
        uses: trufflesecurity/trufflehog@24c98ca20e421a6807518f79c5cdd063400774f2 # main pinned 2026-08-04
        with:
          extra_args: --results=verified,unknown

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Export locked production dependencies
        run: >
          uv export
          --locked
          --no-dev
          --no-emit-local
          --format requirements.txt
          --output-file requirements-audit.txt

      - name: Audit Python dependencies
        run: >
          uvx --from pip-audit==2.10.0
          pip-audit
          --require-hashes
          --requirement requirements-audit.txt
          --progress-spinner off

  gitleaks-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Secret scan with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Milestone 4 remaining:
  # Trivy HIGH/CRITICAL gate, Conftest/Rego, CycloneDX SBOMs,
  # OCI provenance, and evidence summary.
  #
  # Milestone 5:
  # Cosign signing, ECR attachment/verification, live Bedrock,
  # latency, and model-graded evaluations.