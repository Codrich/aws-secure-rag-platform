name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # weekly baseline scan

permissions:
  contents: read

jobs:
  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: IaC scan (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure
          config_file: checkov.yml
          quiet: true
          soft_fail: false

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  # Phase 5: prompt-injection suite (evaluations/security) as a blocking gate
  # Phase 6: docker build -> Trivy scan -> SBOM (CycloneDX) -> Cosign sign -> ECR push
