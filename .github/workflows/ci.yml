name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # id-token: write  # Phase 2: AWS OIDC for deploys

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app
      - name: Type check (mypy)
        run: mypy app
      - name: Unit tests
        run: pytest -q

  terraform-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive infrastructure
      - name: Validate
        working-directory: infrastructure/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

  security-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: IaC scan (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure
          quiet: true
          soft_fail: false
      - name: Secret scan (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  # Phase 5+: RAG security tests and AI evaluation gates run here and
  # block the pipeline when quality or safety thresholds fail.
  # Phase 6: docker build -> Trivy scan -> SBOM (CycloneDX) -> Cosign sign -> ECR push
