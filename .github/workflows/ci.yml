name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app scripts
      - name: Type check (mypy)
        run: mypy app
      - name: Unit tests
        run: pytest app/tests -q
      - name: AI evaluation gates (offline, blocking)
        run: python scripts/run_evaluations.py

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Initialize schema and provision the non-privileged runtime role
        env:
          ADMIN_DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
          DATABASE_URL: postgresql://rag_app:rag_app@localhost:5432/rag
          EMBEDDING_DIMENSIONS: "4"
        run: python scripts/initialize_database.py
      - name: Row-level security isolation tests (real PostgreSQL, non-privileged role)
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
          TEST_DATABASE_URL: postgresql://rag_app:rag_app@localhost:5432/rag
          EMBEDDING_DIMENSIONS: "4"
        run: pytest app/tests/test_rls_integration.py -v
