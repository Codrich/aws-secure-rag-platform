name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app scripts
      - name: Type check (mypy)
        run: mypy app
      - name: Unit tests
        run: pytest app/tests -q
      - name: AI evaluation gates (offline, blocking)
        run: python scripts/run_evaluations.py
